[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobee"
version = "0.1.0"
description = "极简 AI Agent 框架"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agent", "ai", "framework", "plugin"]
license = {text = "MIT"}
dependencies = [
    "click>=8.0.0",
    "croniter>=2.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "toml>=0.10.2",
    "httpx>=0.24.0",
    "tiktoken>=0.5.0",
    "jinja2>=3.1.0",
    "json_repair>=0.59.0",
    "openai>=1.0.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
nanobee = "nanobee.cli.main:main"

[project.optional-dependencies]
web = [
    "duckduckgo-search>=7.0.0",
    "readability-lxml>=0.8.0",
    "lxml>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "orjson>=3.0.0",
    "nanobee[web]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanobee*"]


