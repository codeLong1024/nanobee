[plugin]
name = "channel_dingtalk"
version = "1.0.0"
description = "钉钉机器人通道（Stream SDK + AI Card 流式输出）"
author = "nanobee-team"
type = "channel"

[config]
# ==== 钉钉应用凭证 ====
# client_id = ""
# client_secret = ""

# ==== 流式输出 ====
# streaming = true
# 卡片流式推送最小间隔（秒）。间隔内增量仅累积，由流结束终态全量推送兜底。
# 0 = 逐 delta 推送（旧行为）。
# stream_push_min_interval = 1.0

# ==== 代理 ====
# proxy_url = ""

# ==== 媒体（以下三项已生效）====
# enable_media_upload = true        # 媒体读取总开关（false = 本地与远端均拒绝）
# media_max_mb = 20                 # 远端与本地附件共用的体积上限（MB，>= 1）
# media_local_roots = []            # 本地附件白名单根（相对路径按 data_dir 解析；
#                                   # data_dir 与入站附件目录始终放行）

# ==== 媒体：以下两项尚未接线（配置无效）====
# 注：分片上传已实现（>20MB 自动切换），阈值/块大小目前是代码内常量。
# enable_chunk_upload = true
# chunk_size_kb = 5120

# ==== 文件解析 ====
# enable_file_parsing = false
# max_file_parse_chars = 2000

# ==== AI Agent 标记处理 ====
# enable_marker_processing = true
# enable_video_thumbnail = true

# ==== 消息标题 ====
# markdown_title = "智能体回复"
