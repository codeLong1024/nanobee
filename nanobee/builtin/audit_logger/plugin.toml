[plugin]
name = "audit_logger"
version = "3.2.0"
description = "参考插件：turn/tool 两级 span 结构化审计日志（TurnReport 纯映射，契约 v3）"
author = "nanobee"
type = "audit"

[config]
enabled = true

[hooks.on_message_started]
priority = 10

[hooks.on_pre_invoke]
priority = 10

[hooks.on_post_invoke]
priority = 10

[hooks.on_message_completed]
block_next = false
priority = 10
